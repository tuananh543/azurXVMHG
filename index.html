<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trang cá nhân</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="wrap">
  <div class="coop">
    <span class="coop-i"><img id="coopLogo" alt=""></span>
    <span class="coop-x" aria-hidden="true">×</span>
    <span class="coop-i"><img id="partnerIcon" alt=""></span>
    <span id="coopText"></span>
  </div>

  <div class="view" id="view-home">
    <section class="cover has-img" id="cover" aria-label="Ảnh bìa">
      <div class="cover-bg">
        <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
        <img id="coverImg" alt="Ảnh bìa">
      </div>
      <div class="avatar-wrap">
        <div class="ring"></div>
        <div class="avatar"><img id="avatarImg" alt="Ảnh đại diện"></div>
      </div>
    </section>

    <section class="identity">
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="bio" id="bio"></p>
      <div class="actions" id="links"></div>
      <div class="stats" id="stats"></div>
      <section class="team" aria-label="Thành viên">
        <h2 id="teamTitle"></h2>
        <div class="m-grid" id="members"></div>
      </section>
    </section>
  </div>
  <!-- Các trang Thông tin cá nhân / đơn vị / phòng ban / Trang phục được script.js tạo từ config.js -->
</main>

<button class="theme" id="theme" type="button" aria-label="Đổi giao diện sáng/tối">◐</button>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
